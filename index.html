<style>
:root{
  /* Layout idea: one-thumb field app. Big orange tiles on cream, slate header, bull mark at the top. */
  --orange:#F47A3F;
  --amber:#F7993A;
  --slate:#141211;
  --muted:#5A5450;
  --cream:#F6F1E7;
  --ink:#2B2726;
  --paper:#FFFDF8;
  --line:#D9D0BF;
  --good:#2E7D4F;
  --display:'Manrope',system-ui,-apple-system,'Segoe UI',sans-serif;
  --body:'Manrope',system-ui,-apple-system,'Segoe UI',sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--cream);color:var(--ink);font-family:var(--body);font-size:18px;line-height:1.35;-webkit-text-size-adjust:100%}
body{padding-bottom:calc(110px + env(safe-area-inset-bottom))}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--display);font-weight:800;text-transform:uppercase;margin:0;line-height:1.05;text-wrap:balance;letter-spacing:.8px}
.app{max-width:520px;margin:0 auto}
header.bar{border-bottom:4px solid var(--orange);position:sticky;top:0;z-index:5;background:var(--slate);color:var(--cream);display:flex;align-items:center;gap:12px;padding:calc(10px + env(safe-area-inset-top)) 16px 10px}
header.bar .t{flex:1;min-width:0}
header.bar .rf{flex:none;width:42px;height:42px;border-radius:50%;border:1px solid rgba(255,255,255,.18);background:rgba(255,255,255,.08);color:var(--cream);display:grid;place-items:center;padding:0}
header.bar .rf.spin svg{animation:rfspin .8s linear infinite}
@keyframes rfspin{to{transform:rotate(360deg)}}
header.bar .t b{display:block;font-family:var(--display);font-weight:800;text-transform:uppercase;letter-spacing:.8px;font-size:24px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
header.bar .t span{display:block;font-size:14px;opacity:.85;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.back{border:0;background:rgba(251,243,228,.14);color:var(--cream);height:44px;min-width:44px;border-radius:3px;font-size:22px;cursor:pointer}
.chips{display:flex;gap:8px;flex-wrap:wrap;padding:12px 16px 0}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:14px;font-weight:600;background:var(--paper);border:1px solid var(--line);border-radius:4px;padding:4px 10px}
.chip i{width:8px;height:8px;border-radius:50%;background:var(--good);display:inline-block}
main{padding:16px;display:flex;flex-direction:column;gap:16px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tile{appearance:none;border:0;cursor:pointer;text-align:left;background:var(--orange);color:var(--ink);border-radius:4px;padding:16px;min-height:112px;display:flex;flex-direction:column;justify-content:space-between;gap:8px;border-bottom:4px solid rgba(0,0,0,.35)}
.tile:active{transform:translateY(2px);border-bottom-width:1px}
.tile b{font-family:var(--display);font-weight:800;text-transform:uppercase;letter-spacing:.8px;font-size:27px;line-height:1.05}
.tile small{font-size:15px;font-weight:600;opacity:.85}
.tile.alt{background:var(--paper);border:2px solid var(--slate);border-bottom-width:5px;border-bottom-width:4px}
.tile.dark{background:var(--slate);color:var(--cream)}
.tile.wide{grid-column:1/-1;min-height:96px}
.card{background:var(--paper);border:1px solid var(--line);border-radius:4px;padding:14px;display:flex;flex-direction:column;gap:10px}
.card h3{font-size:18px}
.row{display:flex;gap:10px;align-items:center}
.row.sp{justify-content:space-between}
.row.wrap{flex-wrap:wrap}
label.f{display:flex;flex-direction:column;gap:4px;font-size:14px;font-weight:700;color:var(--muted);flex:1;min-width:0}
input[type=text],input[type=number],input[type=search],select,textarea{width:100%;min-height:52px;padding:10px 12px;border:2px solid var(--line);border-radius:3px;background:#fff;font-size:18px;font-weight:500}
textarea{min-height:110px;resize:vertical}
input:focus,select:focus,textarea:focus,button:focus-visible,summary:focus-visible,label.btn:focus-within{outline:3px solid var(--amber);outline-offset:2px}
.btn{appearance:none;border:0;cursor:pointer;background:var(--orange);color:var(--ink);font-weight:700;font-size:18px;min-height:54px;padding:0 18px;border-radius:4px;display:inline-flex;align-items:center;justify-content:center;gap:8px;border-bottom:4px solid rgba(0,0,0,.35)}
.btn:active{transform:translateY(2px);border-bottom-width:1px}
.btn.ghost{background:transparent;border:2px solid var(--slate);box-shadow:none}
.btn.slate{background:var(--slate);color:var(--cream)}
.btn.full{width:100%}
.btn.small{min-height:44px;font-size:16px;padding:0 12px}
.muted{color:var(--muted);font-size:15px}
.big{font-family:var(--display);font-weight:800;font-size:34px;line-height:1}
.stat{display:flex;gap:10px}
.stat div{flex:1;background:var(--paper);border:1px solid var(--line);border-radius:4px;padding:10px 12px}
.stat span{display:block;font-size:13px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.6px}
.stat b{font-family:var(--display);font-weight:800;text-transform:uppercase;letter-spacing:.8px;font-size:26px;font-variant-numeric:tabular-nums}
.list{display:flex;flex-direction:column;gap:10px}
.item{background:var(--paper);border:1px solid var(--line);border-radius:4px;padding:12px;display:flex;gap:12px;align-items:center}
.item .g{flex:1;min-width:0}
.item .g b{display:block}
.item .g span{font-size:15px;color:var(--muted)}
.item.link{cursor:pointer;width:100%;text-align:left}
.tag{font-size:13px;font-weight:700;border-radius:2px;padding:2px 8px;background:var(--cream);border:1px solid var(--line)}
.tag.on{background:var(--amber);border-color:var(--amber)}
.photos{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.ph{background:var(--slate);border-radius:3px;aspect-ratio:1;overflow:hidden;position:relative;display:flex;align-items:flex-end}
.ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.ph span{position:relative;font-size:12px;font-weight:700;background:var(--cream);margin:6px;padding:1px 6px;border-radius:6px}
.check{display:flex;gap:14px;align-items:center;min-height:60px;padding:8px 12px;background:var(--paper);border:1px solid var(--line);border-radius:4px;cursor:pointer}
.check input{width:28px;height:28px;accent-color:var(--orange);flex:none}
.check.done span{text-decoration:line-through;color:var(--muted)}
pre{margin:0;white-space:pre-wrap;word-break:break-word;font-size:14px;line-height:1.4;background:#fff;border:1px solid var(--line);border-radius:3px;padding:12px;max-height:280px;overflow:auto}
details summary{cursor:pointer;font-weight:700;min-height:44px;display:flex;align-items:center}
.fab{position:fixed;right:max(16px,calc(50% - 244px));bottom:calc(18px + env(safe-area-inset-bottom));z-index:6;border:0;border-radius:4px;background:var(--orange);color:var(--ink);height:64px;padding:0 22px;font-weight:700;font-size:18px;border-bottom:4px solid rgba(0,0,0,.4);display:flex;gap:8px;align-items:center;cursor:pointer}
.sheet{position:fixed;inset:0;z-index:10;background:rgba(43,39,38,.55);display:flex;align-items:flex-end;justify-content:center}
.sheet>div{background:var(--cream);width:100%;max-width:520px;border-radius:6px 6px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:12px}
.toast{position:fixed;left:50%;bottom:calc(100px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:var(--cream);padding:12px 18px;border-radius:3px;font-weight:600;z-index:12;max-width:90%;text-align:center}
.timer{font-family:var(--display);font-weight:800;font-size:52px;font-variant-numeric:tabular-nums;text-align:center;padding:8px 0}
.note{font-size:14px;color:var(--muted);text-align:center;padding:4px 16px 0}
.file{position:absolute;opacity:0;width:1px;height:1px}
@media (prefers-reduced-motion:no-preference){.tile,.btn{transition:transform .08s}}


body.noauth .app,body.noauth .nav{visibility:hidden}
#splash.hold *{animation-play-state:paused!important}
body.spl .app,body.spl .nav,body.spl #fab{visibility:hidden}
#splash{position:fixed;inset:0;z-index:100;contain:strict;background:var(--orange);display:flex;align-items:center;justify-content:center;overflow:hidden;transition:opacity .45s ease;animation:bgswap .4s ease 4.95s forwards,jolt .5s ease-out 1.2s}
#splash.out{opacity:0;pointer-events:none}
#splash .s1{will-change:transform,opacity;display:flex;flex-direction:column;align-items:center;gap:6px;animation:slam 2.4s linear both,exit1 .35s ease-in 5s forwards}
#splash .s1 svg{width:min(72vw,300px);height:auto;overflow:visible}
#splash .head{transform-box:view-box;transform-origin:50px 62px;animation:shake 1.3s ease-in-out 2.3s 2}
#splash .puff{fill:#F6F1E7;opacity:0;transform-box:fill-box;transform-origin:center;animation:steam 1.3s ease-out 2 both}
#splash .s1 b{font-family:var(--display);font-weight:800;text-transform:uppercase;letter-spacing:6px;font-size:34px;color:#fff;text-shadow:0 2px 12px rgba(0,0,0,.65);animation:fadein .5s ease-out 2.4s both}
#splash .s2{position:absolute;left:50%;top:50%;width:min(78vw,340px);margin:0;transform:translate(-50%,-50%);opacity:0;animation:logoin .9s cubic-bezier(.2,1.5,.4,1) 5.2s forwards}
#splash .s2 img{width:100%;height:auto;display:block}
#splash .flash{position:absolute;left:50%;top:50%;width:140px;height:140px;margin:-70px 0 0 -70px;border-radius:50%;background:radial-gradient(circle,rgba(247,153,58,.9),rgba(244,122,63,0) 70%);opacity:0;animation:flash .9s ease-out 5.15s forwards}
@keyframes bgswap{to{background:#141211}}
@keyframes drop{0%{transform:translateY(-110vh) rotate(-5deg);animation-timing-function:ease-in}52%{transform:translateY(0) rotate(0);animation-timing-function:ease-out}68%{transform:translateY(-7%);animation-timing-function:ease-in}82%{transform:translateY(0);animation-timing-function:ease-out}91%{transform:translateY(-2%);animation-timing-function:ease-in}100%{transform:translateY(0)}}
@keyframes exit1{to{opacity:0;transform:scale(1.35)}}
@keyframes logoin{0%{opacity:0;transform:translate(-50%,-50%) scale(.15)}100%{opacity:1;transform:translate(-50%,-50%) scale(1)}}
@keyframes flash{0%{opacity:.9;transform:scale(.2)}100%{opacity:0;transform:scale(6)}}
@keyframes rise{from{opacity:0;transform:translateY(18px) scale(.86)}to{opacity:1;transform:none}}
@keyframes fadein{from{opacity:0}to{opacity:1}}
@keyframes shake{0%,100%{transform:rotate(0)}12%{transform:rotate(-10deg)}28%{transform:rotate(9deg)}44%{transform:rotate(-7deg)}60%{transform:rotate(6deg)}76%{transform:rotate(-3deg)}90%{transform:rotate(1.5deg)}}
@keyframes steam{0%{opacity:0;transform:translate(0,0) scale(.35)}15%{opacity:.85}100%{opacity:0;transform:translate(var(--dx),var(--dy)) scale(1.9)}}

/* ---- modern restyle: soft glass cards, pills, glow, tight bold type ---- */
:root{--orange-deep:#C4561F;--glass:rgba(255,255,255,.72);--hair:rgba(20,18,17,.08)}
body{background:radial-gradient(900px 420px at 85% -80px,rgba(244,122,63,.18),transparent 70%),var(--cream);font-weight:500}
h1,h2,h3,.tile b,header.bar .t b,.stat b,.timer,.big,.total b,.nums{text-transform:none;letter-spacing:-.02em}
header.bar{border-bottom:1px solid rgba(255,255,255,.08);background:rgba(20,18,17,.94);backdrop-filter:blur(10px)}
header.bar .t b{font-size:20px;font-weight:800}
.back{border-radius:50%}
.chips{padding-top:14px}
.chip,.pill{display:inline-flex;align-items:center;gap:8px;font-size:13px;font-weight:700;background:var(--glass);border:1px solid var(--hair);border-radius:999px;padding:7px 14px;backdrop-filter:blur(8px)}
.chip i,.pill i{width:8px;height:8px;border-radius:50%;background:#34c37a;box-shadow:0 0 0 4px rgba(52,195,122,.18)}
.hero-head{display:flex;flex-direction:column;gap:14px;align-items:flex-start;padding:6px 0 2px}
.hero-head h1{font-size:42px;line-height:1.02;font-weight:800;letter-spacing:-.035em}
.grad{background:linear-gradient(90deg,#F47A3F,#F7B24A);-webkit-background-clip:text;background-clip:text;color:transparent}
.grid{gap:14px}
.tile{border-radius:22px;padding:18px;min-height:118px;gap:10px;position:relative;overflow:hidden}
.tile b{font-size:21px;font-weight:800}
.tile small{font-size:14px;font-weight:600}
.tile .ic{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;margin-bottom:auto;background:rgba(20,18,17,.14);color:var(--ink);flex:none}
.tile .ic svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.tile.hero,.tile:not(.alt):not(.dark){background:linear-gradient(135deg,#F47A3F 0%,#F58A44 55%,#F7993A 100%);box-shadow:0 14px 34px -10px rgba(244,122,63,.65),inset 0 1px 0 rgba(255,255,255,.35)}
.tile.hero{min-height:140px}
.tile.hero b{font-size:30px}
.tile.alt{background:var(--glass);border:1px solid var(--hair);box-shadow:0 10px 30px -14px rgba(20,18,17,.25);backdrop-filter:blur(8px)}
.tile.alt .ic{background:rgba(244,122,63,.14);color:var(--orange-deep)}
.tile.dark{background:radial-gradient(220px 120px at 100% 0,rgba(244,122,63,.35),transparent 70%),linear-gradient(160deg,#1d1a19,#0e0d0c);box-shadow:0 14px 34px -14px rgba(0,0,0,.6),inset 0 1px 0 rgba(255,255,255,.08)}
.tile.dark .ic{background:rgba(255,255,255,.1);color:#F7993A}
.tile.short{min-height:72px;flex-direction:row;align-items:center;justify-content:flex-start;gap:14px;padding:14px 18px}
.tile.short .ic{margin-bottom:0}
.tile.short b{font-size:20px}
.tile:active,.btn:active{transform:scale(.985);filter:none}
.card{background:var(--glass);border:1px solid var(--hair);border-radius:22px;padding:18px;box-shadow:0 10px 30px -16px rgba(20,18,17,.25);backdrop-filter:blur(8px)}
.card h3,.stat span{font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.16em;color:var(--muted)}
.item,.check,.stat div,pre{background:var(--glass);border:1px solid var(--hair);border-radius:16px}
.item .g b{font-weight:700}
.stat div{padding:12px 14px}
.stat b{font-size:24px;font-weight:800}
.total{border-radius:18px;background:linear-gradient(160deg,#1d1a19,#0e0d0c)}
.btn{border-radius:999px;min-height:56px;padding:0 24px;font-weight:800;letter-spacing:-.01em;background:linear-gradient(135deg,#F47A3F,#F7993A);box-shadow:0 12px 28px -10px rgba(244,122,63,.7),inset 0 1px 0 rgba(255,255,255,.35)}
.btn:not(.ghost):not(.slate):not(.small)::after{content:'\2192';font-weight:800}
.btn.ghost{background:transparent;border:1.5px solid rgba(20,18,17,.25);box-shadow:none}
.btn.slate{background:linear-gradient(160deg,#1d1a19,#0e0d0c);color:var(--cream);box-shadow:none}
.btn.small{min-height:44px;padding:0 14px}
input[type=text],input[type=number],input[type=search],select,textarea{border-radius:14px;border:1px solid rgba(20,18,17,.14);background:rgba(255,255,255,.9);font-weight:600}
input:focus,select:focus,textarea:focus{border-color:var(--orange);outline:3px solid rgba(244,122,63,.3);outline-offset:0}
label.f{font-size:12px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
label.f input,label.f select{letter-spacing:0;text-transform:none;font-size:17px}
.tag{border-radius:999px;font-weight:800}
.ph{border-radius:16px}
.fab{border-radius:50%;box-shadow:0 14px 30px -8px rgba(244,122,63,.8)}
.note{display:none}
.tile,.btn,.fab{border-bottom:0}
.tile.alt{border:1px solid var(--hair)}
.btn.ghost{border:1.5px solid rgba(20,18,17,.25)}
.fab{border-radius:999px}
.item .g span{display:block;margin-top:2px}

body{background:radial-gradient(700px 380px at 100% 0,rgba(244,122,63,.30),transparent 70%),radial-gradient(600px 400px at 0 100%,rgba(247,153,58,.22),transparent 70%),linear-gradient(180deg,#FBEBDB 0%,#F6EEE2 45%,#F3E5D2 100%);background-attachment:fixed;min-height:100%;padding-bottom:calc(150px + env(safe-area-inset-bottom))}
.nav{position:fixed;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom));max-width:496px;margin:0 auto;z-index:20;display:grid;grid-template-columns:repeat(4,1fr);gap:4px;padding:8px;border-radius:26px;background:rgba(20,18,17,.94);backdrop-filter:blur(14px);box-shadow:0 18px 40px -12px rgba(0,0,0,.55),inset 0 1px 0 rgba(255,255,255,.08)}
.nav button{appearance:none;border:0;background:transparent;color:rgba(246,241,231,.65);display:flex;flex-direction:column;align-items:center;gap:3px;min-height:56px;padding:6px 4px;border-radius:18px;font-size:12px;font-weight:700;cursor:pointer}
.nav button .ni svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;display:block}
.nav button.on{background:linear-gradient(135deg,#F47A3F,#F7993A);color:var(--ink);box-shadow:0 8px 20px -8px rgba(244,122,63,.8)}
.nav button:focus-visible{outline:3px solid var(--amber);outline-offset:2px}
.fab{bottom:calc(98px + env(safe-area-inset-bottom));width:58px;height:58px;padding:0;justify-content:center;font-size:24px;border-radius:50%}
.toast{bottom:calc(170px + env(safe-area-inset-bottom))}

.nav button{position:relative;z-index:1}
.nav .ind{position:absolute;top:8px;bottom:8px;left:8px;width:calc((100% - 28px) / 4);border-radius:18px;background:linear-gradient(135deg,#F47A3F,#F7993A);box-shadow:0 8px 20px -8px rgba(244,122,63,.8);transform:translateX(calc(var(--i,0) * (100% + 4px)));transition:transform .42s cubic-bezier(.3,1.35,.5,1)}
.nav button.on{background:none;box-shadow:none;color:var(--ink)}
.nav button.on .ni{animation:pop .45s cubic-bezier(.3,1.6,.5,1)}
@keyframes pop{0%{transform:scale(.7) translateY(4px)}60%{transform:scale(1.25) translateY(-2px)}100%{transform:none}}
#view.enter>*{animation:up .45s cubic-bezier(.2,.7,.2,1) both}
#view.enter>*:nth-child(2){animation-delay:.05s}#view.enter>*:nth-child(3){animation-delay:.1s}#view.enter>*:nth-child(4){animation-delay:.15s}#view.enter>*:nth-child(5){animation-delay:.2s}#view.enter>*:nth-child(n+6){animation-delay:.25s}
@keyframes up{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.kpi{background:var(--glass);border:1px solid var(--hair);border-radius:20px;padding:16px;display:flex;flex-direction:column;gap:4px;box-shadow:0 10px 30px -16px rgba(20,18,17,.25)}
.kpi span{font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.14em;color:var(--muted)}
.kpi b{font-size:38px;font-weight:800;letter-spacing:-.03em;line-height:1.05;font-variant-numeric:tabular-nums}
.kpi small{font-size:13px;font-weight:600;color:var(--muted)}
.kpi:first-child b{background:linear-gradient(90deg,#F47A3F,#F7B24A);-webkit-background-clip:text;background-clip:text;color:transparent}
.live{appearance:none;border:0;cursor:pointer;width:100%;text-align:left;color:var(--cream);display:flex;align-items:center;gap:14px;padding:16px 18px;border-radius:20px;background:radial-gradient(200px 100px at 100% 0,rgba(244,122,63,.35),transparent 70%),linear-gradient(160deg,#1d1a19,#0e0d0c)}
.live .g{flex:1;min-width:0}.live small{display:block;font-size:12px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;opacity:.7}.live b{font-size:20px;font-weight:800}
.live .lt{font-size:20px;font-weight:800;font-variant-numeric:tabular-nums;color:#F7B24A}
.live .dot{width:12px;height:12px;border-radius:50%;background:#34c37a;box-shadow:0 0 0 0 rgba(52,195,122,.6);animation:pulse 1.6s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(52,195,122,.55)}100%{box-shadow:0 0 0 14px rgba(52,195,122,0)}}
@media (prefers-reduced-motion:reduce){#view.enter>*,.nav button.on .ni,.live .dot{animation:none}.nav .ind{transition:none}}

.kpi.today{flex-direction:row;gap:0;padding:14px 8px}
.kpi.today>div{flex:1;display:flex;flex-direction:column;gap:4px;padding:0 10px;border-right:1px solid var(--hair)}
.kpi.today>div:last-child{border-right:0}
.kpi.today b{font-size:24px;background:none;color:var(--ink);-webkit-text-fill-color:var(--ink)}
.sdot{width:12px;height:12px;border-radius:50%;flex:none;background:#34c37a}
.sdot.bad{background:#E5484D}.sdot.warn{background:#F5A524}
.dtl{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:700;color:var(--muted);margin-top:6px}
.dt{min-height:40px;border:1px solid rgba(20,18,17,.14);border-radius:10px;padding:4px 8px;font-size:15px;background:#fff;font-weight:600}

#splash .dust{position:absolute;left:0;right:0;top:calc(50% + 48px);height:0;pointer-events:none}
#splash .d{position:absolute;border-radius:50%;background:radial-gradient(circle,rgba(246,241,231,.92),rgba(246,241,231,0) 68%);opacity:0;transform:translate(-50%,-50%) scale(.3);animation:dust 1.1s ease-out both}
@keyframes dust{0%{opacity:0;transform:translate(-50%,-50%) scale(.3)}18%{opacity:.95}100%{opacity:0;transform:translate(calc(-50% + var(--dx,0px)),calc(-50% + var(--dy,-40px))) scale(2.4)}}
@keyframes push{
0%{transform:scale(.04) rotate(-10deg);opacity:0;animation-timing-function:cubic-bezier(.3,0,.6,1)}
10%{opacity:1}
44%{transform:scale(1.22) rotate(3deg);opacity:1;animation-timing-function:ease-out}
60%{transform:scale(.95) rotate(-1deg);animation-timing-function:ease-in-out}
78%{transform:scale(1.04);animation-timing-function:ease-in-out}
100%{transform:none;opacity:1}}

9%{opacity:1}
50%{transform:translateY(0) scale(1);opacity:1;animation-timing-function:ease-out}
58%{transform:scale(.93) rotate(0)}

<script>
(function(){
const KEY='elJefe.v1';
const WALLS=['north','east','south','west'];
const DEFAULT_TEMPLATE=['Clean up debris','Haul away the dumpster','Take after photos','Walk the customer through the work','Get the customer OK on the finished work'];

function logo(px){

}

function seed(){
  return {jobs:[],template:DEFAULT_TEMPLATE.slice(),vault:[
    {id:'v1',name:'Contractor license',file:''},
    {id:'v2',name:'Liability insurance certificate',file:''},
    {id:'v3',name:'Workers comp certificate',file:''},
    {id:'v4',name:'W-9',file:''}],picked:{v1:true,v2:true}};
}
function blankJob(name,addr){
  return {id:'j'+Date.now(),customer:name,address:addr,created:Date.now(),rooms:[],photos:[],notes:[],scope:'',receipts:[],clock:{entries:[],running:null},checklist:S0().template.map(t=>({text:t,done:false}))};
}
function S0(){return window.__S||{template:DEFAULT_TEMPLATE}}
function load(){try{const r=JSON.parse(localStorage.getItem(KEY));if(r&&r.jobs)return r}catch(e){}return null}
function hsh(t){let h=5381;for(let i=0;i<t.length;i++)h=((h<<5)+h+t.charCodeAt(i))|0;return String(h)}
function strip(k,v){return k==='url'?undefined:v}
function jhash(j){return hsh(JSON.stringify(j,function(k,v){return(k==='url'||k==='upd'||k==='_h')?undefined:v}))}
function stamp(){S.jobs.forEach(function(j){const h=jhash(j);if(j._h!==h){j._h=h;j.upd=Date.now()}});
  const sh=hsh(JSON.stringify({t:S.template,v:S.vault,p:S.picked}));if(S._sh!==sh){S._sh=sh;S.supd=Date.now()}}
function save(){try{stamp()}catch(e){}try{localStorage.setItem(KEY,JSON.stringify(S,strip))}catch(e){}try{queueSync()}catch(e){}}

let S=load(); window.__S=S||{template:DEFAULT_TEMPLATE};
if(!S){S=seed();window.__S=S}
const SBU='https://rcobrmcnjhqucumflaqo.supabase.co',SBK='sb_publishable_-qyQ5m9jkJq8Q6fs313duA_xNJmCd7U',SK='ejefe-sb',UPK='ejefe-up',PK='ejefe-pushed',LS='ejefe-last';
let sess=jget(SK,null),syncing=false,syncErr='',syncTimer=null,missTried={};
let V={name:'home',id:null};
let quickPhotos=[];
let q='';

const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const job=()=>S.jobs.find(j=>j.id===V.id);
const walls=r=>Math.round(2*(r.l+r.w)*r.h);
const ceil=r=>Math.round(r.l*r.w);
const fmtT=t=>new Date(t).toLocaleTimeString([], {hour:'numeric',minute:'2-digit'});
const fmtD=t=>new Date(t).toLocaleDateString([], {month:'short',day:'numeric'});
function dur(ms){const m=Math.floor(ms/60000);return Math.floor(m/60)+' h '+(m%60)+' min'}
function clockTotal(j){return j.clock.entries.reduce((a,e)=>a+(e.out-e.in),0)+(j.clock.running?Date.now()-j.clock.running:0)}

function toast(msg){const t=document.createElement('div');t.className='toast';t.textContent=msg;document.body.appendChild(t);setTimeout(()=>t.remove(),2200)}
function copyText(text,msg){
  const done=()=>toast(msg||'Copied');
  const fallback=()=>{
    $('#layer').innerHTML='<div class="sheet"><div><h3>Copy this</h3><textarea id="cp" readonly>'+esc(text)+'</textarea><button class="btn full" data-a="closeSheet">Done</button></div></div>';
    const ta=$('#cp');ta.focus();ta.select();
  };
  try{navigator.clipboard.writeText(text).then(done,fallback)}catch(e){fallback()}
}

function go(name,id){V.name=name;if(id!==undefined)V.id=id;render();window.scrollTo(0,0)}

/* ---------- header ---------- */
function bar(){
  const home=V.name==='home';
  const top=['jobs','vault','settings'].includes(V.name);
  const j=V.id?job():null;
  const titles={newjob:'New job',jobs:'Open job',vault:'Documents',job:j?j.customer:'',measure:'Measurements',photos:'Photos',notes:'Scope and notes',receipts:'Receipts',clock:'Time clock',closeout:'Closeout list',export:'Export job',settings:'Settings'};
  if(home){
    $('#bar').innerHTML=logo(48)+'<div class="t"><b>El Jefe</b><span>Handy Pro Services</span></div>';
  }else if(top){
    $('#bar').innerHTML=logo(40)+'<div class="t"><b>'+esc(titles[V.name])+'</b><span>Handy Pro Services</span></div>';
  }else{
    const sub=(j&&V.name!=='job')?j.customer+' · '+j.address:(j?j.address:'');

function docIssues(){
  const out=[];
  S.vault.forEach(function(d){
    if(!d.file){out.push({id:d.id,name:d.name,msg:'Not uploaded yet',bad:true});return}
    if(d.exp){
      const days=Math.ceil((new Date(d.exp+'T00:00:00')-new Date())/864e5);
      if(days<0)out.push({id:d.id,name:d.name,msg:'Expired '+(-days)+' days ago',bad:true});
      else if(days<=30)out.push({id:d.id,name:d.name,msg:'Expires in '+days+' days',bad:false});
    }
  });
  return out;
}
function vHome(){
  const jobs=S.jobs, now=Date.now();
  const d0=new Date();d0.setHours(0,0,0,0);const t0=d0.getTime();
  const recent=jobs.slice().sort((a,b)=>b.created-a.created).slice(0,3);
  let todayMs=0,spent=0,pics=0;
  jobs.forEach(function(j){
    j.clock.entries.forEach(function(e){if(e.out>t0)todayMs+=Math.min(e.out,now)-Math.max(e.in,t0)});
    if(j.clock.running)todayMs+=now-Math.max(j.clock.running,t0);
    j.receipts.forEach(function(r){if(r.t>=t0)spent+=(r.amt||0)});
    j.photos.forEach(function(p){if(p.t>=t0)pics++});

  const live=jobs.find(j=>j.clock.running);
  const open=jobs.filter(j=>j.checklist.some(c=>!c.done)).slice(0,3);

  +'<div class="kpi today"><div><span>Hours today</span><b>'+sTime(todayMs)+'</b></div><div><span>Spent today</span><b>$'+Math.round(spent)+'</b></div><div><span>Photos today</span><b>'+pics+'</b></div></div>'

function exportText(j){
  const L=[];
  L.push('EL JEFE JOB EXPORT','Customer: '+j.customer,'Address: '+j.address,'');
  L.push('SCOPE OF WORK',j.scope||'(none yet)','');
  L.push('NOTES (transcribed)');
  j.notes.forEach(n=>L.push('- '+fmtD(n.t)+' '+fmtT(n.t)+': '+n.text));
  if(!j.notes.length)L.push('(none)');
  L.push('','MEASUREMENTS (feet)');
  j.rooms.forEach(r=>L.push('- '+r.name+': '+r.l+' x '+r.w+', ceiling '+r.h+'; walls '+walls(r)+' sq ft, ceiling '+ceil(r)+' sq ft'));
  if(!j.rooms.length)L.push('(none)');
  L.push('','PHOTOS: '+j.photos.length+' (before '+j.photos.filter(p=>p.tag==='Before').length+', after '+j.photos.filter(p=>p.tag==='After').length+', problem '+j.photos.filter(p=>p.tag==='Problem').length+')');
  L.push('RECEIPTS: '+j.receipts.length+', $'+Math.round(j.receipts.reduce((a,r)=>a+(r.amt||0),0)));
  L.push('TIME ON JOB: '+dur(clockTotal(j)));
  L.push('CLOSEOUT: '+j.checklist.filter(c=>c.done).length+' of '+j.checklist.length+' done');
  return L.join('\n');
}

    for(let i=0;i<4;i++){
